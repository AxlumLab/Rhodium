name: CI

on:
  push:
    branches: [main, master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    name: Validate version and baseline
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      baseline: ${{ steps.metadata.outputs.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path('vcpkg.json').read_text())
          version = manifest['version-string']
          baseline = manifest['builtin-baseline']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Expected a stable major.minor.patch version')
          if not re.fullmatch(r'[0-9a-f]{40}', baseline):
              raise SystemExit('Expected a full vcpkg baseline commit SHA')
          cmake = Path('CMakeLists.txt').read_text()
          if not re.search(r'project\(Rhodium\s+VERSION\s+' + re.escape(version) + r'\s', cmake):
              raise SystemExit('CMake and vcpkg manifest versions must match')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != version:
              raise SystemExit('Release tag must exactly match the project version (no v prefix)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nbaseline={baseline}\n')
          PY

      - name: Require annotated release tag on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          [[ "$(git cat-file -t "$GITHUB_REF")" == "tag" ]]
          git merge-base --is-ancestor HEAD origin/main

  build:
    name: ${{ matrix.slug }} Release
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
            slug: windows-msvc
          - os: ubuntu-latest
            triplet: x64-linux
            cc: gcc
            cxx: g++
            slug: linux-gcc
          - os: macos-latest
            triplet: arm64-osx
            cc: clang
            cxx: clang++
            slug: macos-clang

    env:
      BUILD_TYPE: Release
      BUILD_DIR: ${{ github.workspace }}/out/build/${{ matrix.slug }}-Release
      INSTALL_DIR: ${{ github.workspace }}/out/install/rhodium-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}-${{ matrix.triplet }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/out/vcpkg-binary-cache,readwrite'
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Port versions may refer to older Git trees: a shallow checkout is insufficient.
      - name: Checkout vcpkg baseline and history
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.prepare.outputs.baseline }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Verify baseline tree
        shell: bash
        env:
          BASELINE: ${{ needs.prepare.outputs.baseline }}
        run: git -C vcpkg cat-file -e "$BASELINE:versions/baseline.json"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: bash
        run: |
          cmake --version
          ninja --version

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Restore vcpkg binaries and downloads
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg/downloads
            out/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-${{ matrix.triplet }}-

      - name: Set up Python for source download fallback
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache verified Lua source archive
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path

          port = Path('vcpkg/ports/lua')
          metadata = json.loads((port / 'vcpkg.json').read_text())
          version = metadata.get('version') or metadata.get('version-string') or metadata.get('version-semver')
          expected = re.search(r'SHA512\s+([0-9a-f]{128})', (port / 'portfile.cmake').read_text()).group(1)
          archive = Path('vcpkg/downloads') / f'lua-{version}.tar.gz'
          if archive.exists() and hashlib.sha512(archive.read_bytes()).hexdigest() == expected:
              print(f'Using verified cached {archive.name}')
          else:
              # The Brazilian mirror is listed by Lua.org; all candidates must match the pinned SHA-512.
              origins = ['https://www.lua.org/ftp/', 'https://lua.org/ftp/',
                         'https://www.tecgraf.puc-rio.br/lua/ftp/']
              for origin in origins:
                  try:
                      with urllib.request.urlopen(origin + archive.name, timeout=45) as response:
                          data = response.read()
                      if hashlib.sha512(data).hexdigest() != expected:
                          raise ValueError('source archive SHA-512 mismatch')
                      archive.parent.mkdir(parents=True, exist_ok=True)
                      temporary = archive.with_suffix('.partial')
                      temporary.write_bytes(data)
                      temporary.replace(archive)
                      print(f'Cached verified {archive.name} from {origin}')
                      break
                  except (OSError, ValueError) as error:
                      print(f'{origin}: {error}')
              else:
                  raise SystemExit('No Lua source endpoint provided the pinned archive')
          PY

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -BuildDir $env:BUILD_DIR -BuildType $env:BUILD_TYPE -VcpkgRoot "$env:GITHUB_WORKSPACE\vcpkg" -VcpkgTriplet $env:VCPKG_TARGET_TRIPLET

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          RHODIUM_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: bash scripts/build.sh

      - name: Install package
        shell: bash
        run: cmake --install "$BUILD_DIR" --config "$BUILD_TYPE" --prefix "$INSTALL_DIR"

      - name: Smoke check installed CLI
        shell: bash
        run: '"$INSTALL_DIR/bin/rhodium" --version'

      - name: Archive installed package
        shell: bash
        run: |
          mkdir -p dist
          package_name="$(basename "$INSTALL_DIR")"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -E chdir "$INSTALL_DIR/.." cmake -E tar cf "$GITHUB_WORKSPACE/dist/$package_name.zip" --format=zip "$package_name"
          else
            tar -czf "dist/$package_name.tar.gz" -C "$INSTALL_DIR/.." "$package_name"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rhodium-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}-${{ matrix.triplet }}
          path: dist/*
          if-no-files-found: error

      - name: Save completed dependencies even after build failure
        if: always() && steps.vcpkg_cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg/downloads
            out/vcpkg-binary-cache
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    steps:
      - name: Require every package job to succeed
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "metadata: $PREPARE_RESULT; package jobs: $BUILD_RESULT"
          [[ "$PREPARE_RESULT" == "success" && "$BUILD_RESULT" == "success" ]]

  release:
    name: Publish GitHub Release
    needs: [prepare, build, ci-summary]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: rhodium-${{ needs.prepare.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Check packages and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          for package in "rhodium-$VERSION-windows-msvc-x64-windows.zip" "rhodium-$VERSION-linux-gcc-x64-linux.tar.gz" "rhodium-$VERSION-macos-clang-arm64-osx.tar.gz"; do
            test -s "$package"
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "Rhodium $RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false
